<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACE LOCK</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<style>
  :root{ --bg:#0b0e14; --fg:#e8ecf3; --dim:#7d8799; --line:#252c3a; --ok:#37e6a0; --bad:#ff5d6c; --scan:#6ea8ff; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:hidden}
  .clock{font-size:64px;font-weight:200;letter-spacing:-2px;margin-top:8px}
  .date{color:var(--dim);font-size:14px;margin-top:2px}
  .stage{position:relative;width:min(78vw,340px);aspect-ratio:3/4;margin-top:28px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:#000}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:14%;border:2px solid var(--scan);border-radius:50% / 42%;transition:border-color .2s, box-shadow .2s;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
  .stage.ok .frame{border-color:var(--ok);box-shadow:0 0 0 9999px rgba(0,0,0,.35),0 0 24px var(--ok)}
  .stage.bad .frame{border-color:var(--bad)}
  .scanline{position:absolute;left:14%;right:14%;height:2px;background:var(--scan);opacity:.7;animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%{top:16%}50%{top:82%}100%{top:16%}}
  .stage.ok .scanline{display:none}
  #status{margin-top:22px;font-size:17px;text-align:center;min-height:26px}
  #sub{color:var(--dim);font-size:13px;margin-top:6px;text-align:center;min-height:20px}
  .bar{width:min(78vw,340px);height:4px;background:var(--line);border-radius:4px;margin-top:16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
  button{margin-top:auto;background:none;border:1px solid var(--line);color:var(--dim);padding:10px 18px;border-radius:20px;font-size:13px}
  #unlock{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
  #unlock.show{display:flex;animation:pop .5s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  #unlock .mark{font-size:54px}
  #unlock h1{font-size:26px;font-weight:600;margin-top:12px}
  #unlock p{color:var(--dim);margin-top:8px;font-size:14px}
  #code{margin-top:28px;font-size:44px;letter-spacing:10px;font-weight:300;color:var(--ok);font-variant-numeric:tabular-nums}
  #msg{margin-top:14px;font-size:16px}
</style>
</head>
<body>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="stage" id="stage">
    <video id="v" autoplay playsinline muted></video>
    <div class="frame"></div><div class="scanline"></div>
  </div>
  <div id="status">준비 중…</div>
  <div id="sub"></div>
  <div class="bar"><i id="bar"></i></div>
  <button id="flip">카메라 전환</button>

  <div id="unlock">
    <div class="mark">🔓</div>
    <h1>잠금 해제</h1>
    <p id="msg"></p>
    <div id="code"></div>
  </div>

const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
const $ = id => document.getElementById(id);
const video = $("v"), stage = $("stage"), statusEl = $("status"), sub = $("sub"), bar = $("bar");
let refDesc = null, facing = "environment", stream = null, hits = 0, done = false;

function tick(){ const d=new Date(); $("clock").textContent=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
  $("date").textContent=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"}); }
tick(); setInterval(tick,10000);

function setState(cls,text,s){ stage.className="stage "+(cls||""); statusEl.textContent=text; sub.textContent=s||""; }

async function loadModels(){
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
}
async function loadRef(){
  const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=REF;});
  const r = await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.3})).withFaceLandmarks().withFaceDescriptor();
  if(!r) throw new Error("기준 사진에서 얼굴을 찾지 못했어요");
  refDesc = r.descriptor;
}
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},audio:false});
  video.srcObject = stream; await video.play();
}
async function loop(){
  if(done) return;
  try{
    if(video.readyState>=2){
      const opt = new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.4});
      const r = await faceapi.detectSingleFace(video,opt).withFaceLandmarks().withFaceDescriptor();
      if(!r){ hits=0; setState("","얼굴을 카메라에 비춰주세요","사진을 화면 가득 보이도록 가까이 대보세요"); }
      else{
        const dist = faceapi.euclideanDistance(refDesc,r.descriptor);
        if(dist<THRESHOLD){ hits++; setState("ok","얼굴 확인 중…","일치"); }
        else{ hits=0; setState("bad","등록되지 않은 얼굴입니다","다른 사진을 찾아보세요"); }
      }
      bar.style.width = Math.min(100,hits/NEED_FRAMES*100)+"%";
      if(hits>=NEED_FRAMES){ return unlock(); }
    }
  }catch(e){ console.error(e); }
  setTimeout(loop,250);
}
function unlock(){
  done=true; setState("ok","잠금 해제");
  $("msg").textContent=UNLOCK_MESSAGE; $("code").textContent=UNLOCK_CODE;
  $("unlock").classList.add("show");
  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  if(stream) stream.getTracks().forEach(t=>t.stop());
}
$("flip").onclick = async()=>{ facing = facing==="environment"?"user":"environment"; try{await startCam();}catch(e){} };

(async()=>{
  try{
    if(!window.isSecureContext || !navigator.mediaDevices) throw new Error("HTTPS 주소에서 열어야 카메라를 쓸 수 있어요");
    setState("","모델 불러오는 중…","처음 한 번은 몇 초 걸려요");
    await loadModels(); await loadRef();
    setState("","카메라 켜는 중…");
    await startCam();
    setState("","얼굴을 카메라에 비춰주세요");
    loop();
  }catch(e){ setState("bad","오류",String(e.message||e)); }
})();
</script>
